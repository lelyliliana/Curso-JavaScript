<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestor de tareas de práctica</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
<h1>Gestor de tareas</h1>
<p>Proyecto educativo. Usa tareas ficticias: se guardan solo en este navegador y origen cuando el almacenamiento está disponible.</p>
<form id="formulario"><label for="titulo">Título (1 a 80 caracteres)</label><input id="titulo" name="titulo" required maxlength="80" aria-describedby="error"><button id="guardar">Agregar tarea</button><button id="cancelar" type="button" hidden>Cancelar edición</button></form>
<p id="error" role="alert" class="error"></p>
<div class="barra"><label for="filtro">Estado</label><select id="filtro"><option value="todas">Todas</option><option value="pendientes">Pendientes</option><option value="completadas">Completadas</option></select><label for="buscar">Buscar en títulos</label><input id="buscar" type="search"></div>
<p id="estado" role="status"></p><ul id="lista"></ul>
<p><a href="../app-referencia/index.html">Abrir catálogo de laboratorio (requiere servidor del curso)</a></p></main><script type="module" src="app.js"></script></body>
</html>
