<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Validar un formulario</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>Validar un formulario</h1><p>Demostración local con nombres ficticios, sin envío real.</p><form id="formulario"><label for="nombre">Nombre ficticio (al menos dos caracteres)</label><input id="nombre" name="nombre" required minlength="2" aria-describedby="error"><button>Comprobar</button><p id="error" role="alert" class="error"></p></form><pre id="salida"></pre></main><script type="module" src="app.js"></script></body>
